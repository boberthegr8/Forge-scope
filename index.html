function emptyField(){ return { value:'', source:'', status:'Confirmed', reviewed:false }; }
function newProject(type='barn', mode='manual'){
  const fields={};
  SCHEMAS[type].flatMap(s=>s.fields).forEach(f=>fields[f.key]=emptyField());
  return { id:'scope_'+Date.now()+'_'+Math.random().toString(36).slice(2,7), type, mode, createdAt:new Date().toISOString(), updatedAt:new Date().toISOString(), fields, openings:[] };
}

let saved = JSON.parse(localStorage.getItem('forgeScopeProjects') || '[]');
let current = null;
let view = 'dashboard';
let searchTerm = '';

function persist(){ localStorage.setItem('forgeScopeProjects', JSON.stringify(saved)); }
function upsertCurrent(){
  if(!current) return;
  current.updatedAt = new Date().toISOString();
  const idx=saved.findIndex(p=>p.id===current.id);
  if(idx>=0) saved[idx]=JSON.parse(JSON.stringify(current)); else saved.unshift(JSON.parse(JSON.stringify(current)));
  persist();
}
function fmtDate(v){ if(!v) return '—'; return new Date(v).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}); }
function esc(s=''){ return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])); }
function icon(name,cls='w-5 h-5'){ return `<i data-lucide="${name}" class="${cls}"></i>`; }

function layout(content){
  return `
  <aside class="w-64 bg-slate-900 text-white flex-shrink-0 flex flex-col shadow-2xl no-print">
    <div class="p-7 border-b border-slate-800">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 bg-indigo-600 rounded-xl grid place-items-center shadow-lg shadow-indigo-950/30">${icon('clipboard-check','w-6 h-6')}</div>
        <div><div class="font-extrabold tracking-tight text-xl">FORGE</div><div class="text-[10px] uppercase tracking-[.24em] text-slate-500 font-bold">Scope</div></div>
      </div>
    </div>
    <nav class="p-4 space-y-1 flex-1">
      ${navBtn('dashboard','layout-dashboard','Dashboard')}
      ${navBtn('new','plus-circle','New Scope')}
      ${navBtn('saved','folder-open','Saved Scopes', saved.length ? saved.length : '')}
      <div class="pt-5 pb-2 px-4 text-[10px] font-bold uppercase tracking-[.2em] text-slate-500">Templates</div>
      ${navBtn('barns','warehouse','Barns')}
      ${navBtn('sheds','home','Sheds')}
      ${navBtn('decks','panel-top','Decks')}
      <div class="pt-5 pb-2 px-4 text-[10px] font-bold uppercase tracking-[.2em] text-slate-500">AI</div>
      ${navBtn('ai','sparkles','AI Import')}
    </nav>
    <div class="p-4 border-t border-slate-800 text-xs text-slate-500">Forge Suite • Estimator Intake</div>
  </aside>
  <main class="flex-1 min-w-0 flex flex-col overflow-hidden">
    <header class="h-16 bg-white border-b border-slate-200 flex items-center justify-between px-8 no-print">
      <div><h1 class="font-bold text-slate-800">${pageTitle()}</h1><p class="text-xs text-slate-500">Capture it once. Quote it right.</p></div>
      <div class="flex items-center gap-3">
        ${current && (view==='editor'||view==='summary'||view==='ai') ? `<span class="hidden lg:inline text-xs text-slate-500">${esc(current.fields.projectName?.value || 'Untitled Scope')}</span><button onclick="saveCurrent()" class="px-4 py-2 rounded-lg bg-slate-100 hover:bg-slate-200 text-sm font-semibold flex items-center gap-2">${icon('save','w-4 h-4')} Save</button>`:''}
      </div>
    </header>
    <div id="content" class="flex-1 overflow-y-auto p-8 bg-slate-50/70">${content}</div>
  </main>`;
}
function pageTitle(){ return ({dashboard:'Dashboard',new:'New Scope',saved:'Saved Scopes',barns:'Barn Templates',sheds:'Shed Templates',decks:'Deck Templates',editor:'Scope Worksheet',summary:'Scope Summary',ai:'AI Assisted Entry'})[view] || 'Forge Scope'; }
function navBtn(target,ic,label,badge=''){
  const active = view===target || (target==='ai'&&view==='ai');
  return `<button onclick="go('${target}')" class="w-full flex items-center justify-between px-4 py-3 rounded-lg text-sm transition ${active?'bg-slate-800 text-white':'text-slate-400 hover:text-white hover:bg-slate-800/60'}"><span class="flex items-center gap-3">${icon(ic)}<span class="font-medium">${label}</span></span>${badge?`<span class="bg-indigo-600 text-white text-[10px] px-2 py-0.5 rounded-full font-bold">${badge}</span>`:''}</button>`;
}

function render(){
  let content='';
  if(view==='dashboard') content=dashboardView();
  else if(view==='new') content=newView();
  else if(view==='saved') content=savedView();
  else if(view==='barns') content=templateView('barn');
  else if(view==='sheds') content=templateView('shed');
  else if(view==='decks') content=templateView('deck');
  else if(view==='editor') content=editorView();
  else if(view==='summary') content=summaryView();
  else if(view==='ai') content=aiView();
  document.getElementById('app').innerHTML=layout(content);
  lucide.createIcons();
}

function dashboardView(){
  const recent=[...saved].sort((a,b)=>new Date(b.updatedAt)-new Date(a.updatedAt)).slice(0,5);
  return `<div class="max-w-7xl mx-auto fade-in">
    <div class="grid md:grid-cols-3 gap-5 mb-8">
      ${metric('Saved Scopes',saved.length,'folder-open','All estimator worksheets')}
      ${metric('Barns',saved.filter(p=>p.type==='barn').length,'warehouse','Agricultural scopes')}
      ${metric('Needs Attention',saved.filter(p=>Object.values(p.fields||{}).some(f=>f.status==='RFI'||f.status==='Verify')).length,'triangle-alert','Contains RFI / Verify fields')}
    </div>
    <div class="grid lg:grid-cols-[1.3fr_.7fr] gap-6">
      <section class="bg-white border border-slate-200 rounded-2xl shadow-sm overflow-hidden">
        <div class="p-6 border-b border-slate-100 flex items-center justify-between"><div><h2 class="font-bold text-lg">Recent Scopes</h2><p class="text-sm text-slate-500">Pick up where you left off.</p></div><button onclick="go('new')" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg text-sm font-semibold flex items-center gap-2">${icon('plus','w-4 h-4')} New Scope</button></div>
        <div>${recent.length?recent.map(projectRow).join(''):`<div class="p-10 text-center text-slate-500">No saved scopes yet. Create your first Barn, Shed or Deck worksheet.</div>`}</div>
      </section>
      <section class="bg-slate-900 text-white rounded-2xl p-6 shadow-sm">
        <div class="w-11 h-11 bg-indigo-600 rounded-xl grid place-items-center mb-5">${icon('sparkles','w-6 h-6')}</div>
        <h2 class="font-bold text-xl mb-2">Manual + AI</h2><p class="text-sm leading-6 text-slate-300 mb-6">Use the same worksheet either way. Enter fields manually, or download the Forge AI prompt and paste structured results back in.</p>
        <button onclick="startNew('barn','ai')" class="w-full bg-white text-slate-900 rounded-lg px-4 py-3 font-semibold text-sm">Start AI-Assisted Barn</button>
      </section>
    </div>

function buildAIPrompt(){
 const keys=getSchemaKeys(current.type);
 return `FORGE SCOPE — ${TYPES[current.type].label.toUpperCase()} PLAN EXTRACTION\n\nYou are assisting a construction estimator. Review ALL uploaded drawings and specifications thoroughly before answering. Search plans, foundation plans, floor plans, roof/truss plans, elevations, sections, schedules, general notes, structural notes, details and revisions.\n\nRULES:\n1. Do not guess. If information is not shown, omit the field.\n2. If drawings conflict, use status \"Verify\" and briefly explain the conflict in the value.\n3. Use the exact drawing terminology and dimensions where possible.\n4. Include a concise source for each populated value: sheet number + view/detail when available (example: \"S2.1 Roof Framing Plan\").\n5. Use status \"Confirmed\" for information clearly shown, \"Assumption\" only if I explicitly asked you to assume it, \"RFI\" if the missing item blocks the quote, and \"Verify\" for a conflict or uncertain interpretation.\n6. Return JSON only. No markdown fences, no explanation before or after JSON.\n7. Omit unknown/blank fields completely.\n8. For openings, create one object per material opening that affects framing, trusses, foundations or supplied materials.\n\nPROJECT TYPE: ${current.type}\n\nRETURN THIS STRUCTURE:\n{\n  \"projectType\": \"${current.type}\",\n  \"fields\": {\n    \"fieldKey\": {\"value\": \"answer\", \"source\": \"drawing source\", \"status\": \"Confirmed\"}\n  },\n  \"openings\": [\n    {\"wall\":\"North Gable\",\"type\":\"Overhead Door\",\"width\":\"22'-0\\\"\",\"height\":\"14'-0\\\"\",\"location\":\"\",\"header\":\"\",\"framing\":\"\",\"foundationDrop\":\"\",\"source\":\"S2.0\",\"status\":\"Confirmed\"}\n  ]\n}\n\nALLOWED FIELD KEYS:\n${keys.map(x=>`- ${x.key} | ${x.section} | ${x.label}`).join('\n')}\n\nBefore producing JSON, internally cross-check the overall dimensions, wall heights, roof geometry, foundation support and major openings against at least two relevant drawing views when available. Do not output that internal reasoning.`;
}

 try{
  const data=JSON.parse(raw); if(data.projectType && data.projectType!==current.type) throw new Error(`This JSON is for ${data.projectType}, but this scope is ${current.type}.`);
  Object.entries(data.fields||{}).forEach(([k,v])=>{ if(!(k in current.fields)) return; if(typeof v==='string') current.fields[k]={...current.fields[k],value:v,reviewed:false,status:'Confirmed'}; else current.fields[k]={...current.fields[k],value:v.value??'',source:v.source??'',status:STATUS_OPTIONS.includes(v.status)?v.status:'Confirmed',reviewed:false}; });
  if(Array.isArray(data.openings)) current.openings=data.openings.map(o=>({...o,reviewed:false,status:STATUS_OPTIONS.includes(o.status)?o.status:'Confirmed'}));
  current.mode='ai'; upsertCurrent(); view='editor'; render();
 }catch(e){ err.textContent='Could not import: '+e.message; }
}
function exportJSON(){ const blob=new Blob([JSON.stringify(current,null,2)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=(current.fields.projectName?.value||'Forge-Scope').replace(/[^a-z0-9-_]+/gi,'-')+'.json'; a.click(); URL.revokeObjectURL(a.href); }
function textSummary(){ const d=summaryData(); let out=`FORGE SCOPE — ${TYPES[current.type].label.toUpperCase()}\n${current.fields.projectName?.value||'Untitled Scope'}\n\n`; d.sections.forEach(sec=>{out+=sec.title.toUpperCase()+'\n'; sec.items.forEach(x=>{out+=`• ${x.label}: ${x.value}${x.status&&x.status!=='Confirmed'?' ['+x.status+']':''}${x.source?' — Source: '+x.source:''}\n`;}); out+='\n';}); if(d.openings.length){out+='OPENINGS\n';d.openings.forEach((o,i)=>{out+=`• ${o.wall||'Opening '+(i+1)}${o.type?' — '+o.type:''}${o.width?' — '+o.width:''}${o.height?' x '+o.height:''}${o.header?' — '+o.header:''}${o.source?' — Source: '+o.source:''}\n`;});} return out; }
async function copySummary(){ try{await navigator.clipboard.writeText(textSummary()); alert('Scope summary copied.');}catch{alert('Copy failed.');} }

render();
</script>
