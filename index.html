function emptyField(){ return { value:'', source:'', status:'Confirmed', reviewed:false }; }
function newProject(type='barn', mode='manual'){
  const fields={};
  SCHEMAS[type].flatMap(s=>s.fields).forEach(f=>fields[f.key]=emptyField());
  return { id:'scope_'+Date.now()+'_'+Math.random().toString(36).slice(2,7), type, mode, createdAt:new Date().toISOString(), updatedAt:new Date().toISOString(), fields, openings:[] };
}

let saved = JSON.parse(localStorage.getItem('forgeScopeProjects') || '[]');
let current = null;
let view = 'dashboard';
let searchTerm = '';
let bomCompareState = { scope:null, bom:null, plans:[], result:null, loading:false, error:'', status:'' };
let geminiSessionKey = '';
let geminiCompareModel = 'gemini-3.7-flash';

function persist(){ localStorage.setItem('forgeScopeProjects', JSON.stringify(saved)); }
function upsertCurrent(){
  if(!current) return;
  current.updatedAt = new Date().toISOString();
  const idx=saved.findIndex(p=>p.id===current.id);
  if(idx>=0) saved[idx]=JSON.parse(JSON.stringify(current)); else saved.unshift(JSON.parse(JSON.stringify(current)));
  persist();
}
function fmtDate(v){ if(!v) return '—'; return new Date(v).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}); }
function esc(s=''){ return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])); }
function icon(name,cls='w-5 h-5'){ return `<i data-lucide="${name}" class="${cls}"></i>`; }

function layout(content){
  return `
  <aside class="w-64 bg-slate-900 text-white flex-shrink-0 flex flex-col shadow-2xl no-print">
    <div class="p-7 border-b border-slate-800">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 bg-indigo-600 rounded-xl grid place-items-center shadow-lg shadow-indigo-950/30">${icon('clipboard-check','w-6 h-6')}</div>
        <div><div class="font-extrabold tracking-tight text-xl">FORGE</div><div class="text-[10px] uppercase tracking-[.24em] text-slate-500 font-bold">Scope</div></div>
      </div>
    </div>
    <nav class="p-4 space-y-1 flex-1">
      ${navBtn('dashboard','layout-dashboard','Dashboard')}
      ${navBtn('new','plus-circle','New Scope')}
      ${navBtn('saved','folder-open','Saved Scopes', saved.length ? saved.length : '')}
      <div class="pt-5 pb-2 px-4 text-[10px] font-bold uppercase tracking-[.2em] text-slate-500">Templates</div>
      ${navBtn('barns','warehouse','Barns')}
      ${navBtn('sheds','home','Sheds')}
      ${navBtn('decks','panel-top','Decks')}
      <div class="pt-5 pb-2 px-4 text-[10px] font-bold uppercase tracking-[.2em] text-slate-500">AI</div>
      ${navBtn('ai','sparkles','AI Import')}
      ${navBtn('bom','scan-search','Compare to BOM')}
    </nav>
    <div class="p-4 border-t border-slate-800 text-xs text-slate-500">Forge Suite • Estimator Intake</div>
  </aside>
  <main class="flex-1 min-w-0 flex flex-col overflow-hidden">
    <header class="h-16 bg-white border-b border-slate-200 flex items-center justify-between px-8 no-print">
      <div><h1 class="font-bold text-slate-800">${pageTitle()}</h1><p class="text-xs text-slate-500">Capture it once. Quote it right.</p></div>
      <div class="flex items-center gap-3">
        ${current && (view==='editor'||view==='summary'||view==='ai') ? `<span class="hidden lg:inline text-xs text-slate-500">${esc(current.fields.projectName?.value || 'Untitled Scope')}</span><button onclick="saveCurrent()" class="px-4 py-2 rounded-lg bg-slate-100 hover:bg-slate-200 text-sm font-semibold flex items-center gap-2">${icon('save','w-4 h-4')} Save</button>`:''}
      </div>
    </header>
    <div id="content" class="flex-1 overflow-y-auto p-8 bg-slate-50/70">${content}</div>
  </main>`;
}
function pageTitle(){ return ({dashboard:'Dashboard',new:'New Scope',saved:'Saved Scopes',barns:'Barn Templates',sheds:'Shed Templates',decks:'Deck Templates',editor:'Scope Worksheet',summary:'Scope Summary',ai:'AI Assisted Entry',bom:'Compare to BOM'})[view] || 'Forge Scope'; }
function navBtn(target,ic,label,badge=''){
  const active = view===target || (target==='ai'&&view==='ai');
  return `<button onclick="go('${target}')" class="w-full flex items-center justify-between px-4 py-3 rounded-lg text-sm transition ${active?'bg-slate-800 text-white':'text-slate-400 hover:text-white hover:bg-slate-800/60'}"><span class="flex items-center gap-3">${icon(ic)}<span class="font-medium">${label}</span></span>${badge?`<span class="bg-indigo-600 text-white text-[10px] px-2 py-0.5 rounded-full font-bold">${badge}</span>`:''}</button>`;
}

function render(){
  let content='';
  if(view==='dashboard') content=dashboardView();
  else if(view==='new') content=newView();
  else if(view==='saved') content=savedView();
  else if(view==='barns') content=templateView('barn');
  else if(view==='sheds') content=templateView('shed');
  else if(view==='decks') content=templateView('deck');
  else if(view==='editor') content=editorView();
  else if(view==='summary') content=summaryView();
  else if(view==='ai') content=aiView();
  else if(view==='bom') content=bomCompareView();
  document.getElementById('app').innerHTML=layout(content);
  lucide.createIcons();
}

function setBomScopeFile(input){ bomCompareState.scope=input?.files?.[0]||null; bomCompareState.error=''; render(); }
function setBomCompareFile(input){ bomCompareState.bom=input?.files?.[0]||null; bomCompareState.error=''; render(); }
function setBomPlanFiles(input){ bomCompareState.plans=[...(input?.files||[])]; bomCompareState.error=''; render(); }
function fileMime(file){
 if(file.type) return file.type;
 const ext=(file.name.split('.').pop()||'').toLowerCase();
 return ({pdf:'application/pdf',png:'image/png',jpg:'image/jpeg',jpeg:'image/jpeg',webp:'image/webp',csv:'text/csv',txt:'text/plain',md:'text/markdown',json:'application/json'})[ext]||'application/octet-stream';
}
function arrayBufferToBase64(buffer){
 const bytes=new Uint8Array(buffer); let binary=''; const chunk=0x8000;
 for(let i=0;i<bytes.length;i+=chunk) binary+=String.fromCharCode(...bytes.subarray(i,Math.min(i+chunk,bytes.length)));
 return btoa(binary);
}
async function fileToGeminiPart(file){
 const mime=fileMime(file);
 if(mime.startsWith('text/')||mime==='application/json') return {text:`FILE: ${file.name}\n\n${await file.text()}`};
 return {inlineData:{mimeType:mime,data:arrayBufferToBase64(await file.arrayBuffer())}};
}
function currentScopeSnapshot(){
 const filled=[]; const blanks=[];
 if(!current) return {filled,blanks};
 SCHEMAS[current.type].forEach(sec=>sec.fields.forEach(f=>{
  const d=current.fields[f.key]||emptyField();
  if(String(d.value||'').trim()) filled.push(`${f.key} | ${sec.title} | ${f.label}: ${d.value}${d.source?' | Source: '+d.source:''}${d.status&&d.status!=='Confirmed'?' | '+d.status:''}`);
  else blanks.push(`${f.key} | ${sec.title} | ${f.label}`);
 }));
 if(current.openings?.length) filled.push('OPENINGS: '+JSON.stringify(current.openings));
 return {filled,blanks};
}
function buildBomComparePrompt(){
 const snap=currentScopeSnapshot();
 return `FORGE SCOPE — BOM / PLAN COMPARISON\n\nYou are a senior construction estimator performing a material QA review. You have been given: (1) the uploaded Scope of Work / quote request, (2) a bill of materials generated by MiTek or another estimating system, (3) the construction drawings/plans, and (4) an existing Forge Scope intake record below.\n\nOBJECTIVE\nAudit the BOM against BOTH the uploaded Scope of Work and the actual drawings. Do not merely summarize the BOM. Determine what is wrong, missing, duplicated, outside the requested scope, owner-supplied/by-others, the wrong product/specification, or needs verification. Use the drawings and Scope of Work to fill blank Forge Scope fields where the answer is clearly shown.\n\nESTIMATING RULES\n1. Treat the uploaded Scope of Work as the source of truth for what the quote is supposed to INCLUDE or EXCLUDE. Treat the drawings/specifications as the source of truth for what the building actually REQUIRES. If Scope and Plans conflict, flag the conflict explicitly instead of silently choosing one.\n2. Do not invent dimensions or quantities. If a quantity requires a takeoff you cannot support confidently, mark it Verify/TBC.\n3. Distinguish REMOVE, KEEP, ADD, VERIFY/TBC and CHANGE SPEC.\n4. Watch specifically for foundation type, post-frame vs stud-frame vs hybrid construction, wall heights, gable/endwall conditions, truss span/pitch/spacing/bearing, roof/wall strapping or purlins, structural posts/beams, headers/lintels, shearwalls, blocking, bracing, openings, owner/by-others material and truss-engineer deferred items.\n5. For every important finding cite the sheet/detail/source when possible.\n6. Compare quantities, not only product names. Catch conventional-building assumptions that conflict with agricultural/post-frame/curtain-wall construction.\n7. If the BOM includes finishes specifically marked PER OWNER / BY OTHERS, call them out for removal from the supplied quote.\n8. When the plans require a different material (example 1/2 plywood vs 7/16 OSB), classify it as CHANGE SPEC rather than simply ADD.\n9. Preserve uncertainty. Confidence must be High, Medium or Low.\n10. Return JSON only. No markdown and no text outside the JSON object.\n\nCURRENT FORGE SCOPE — POPULATED FIELDS\n${snap.filled.length?snap.filled.join('\n'):'No populated fields yet.'}\n\nCURRENT FORGE SCOPE — BLANK FIELDS AI MAY FILL\n${snap.blanks.join('\n')}\n\nRETURN EXACTLY THIS GENERAL SHAPE (omit empty arrays):\n{\n  "verdict": {"status":"DO NOT PRICE AS-IS | REVIEW REQUIRED | GENERALLY ALIGNED","summary":"short overall call"},\n  "scopeUpdates": {"allowedFieldKey":{"value":"answer from plans","source":"sheet/detail","status":"Confirmed"}},\n  "scopeCorrections": [{"field":"scope field or exclusion","current":"existing value","corrected":"recommended value","reason":"why","source":"sheet/detail","confidence":"High"}],\n  "remove": [{"item":"BOM item","bomQty":"qty if shown","planRequirement":"what plans show","reason":"why remove","source":"sheet/detail","confidence":"High"}],\n  "keep": [{"item":"BOM item","bomQty":"qty if shown","planRequirement":"what plans show","reason":"why it belongs","source":"sheet/detail","confidence":"High"}],\n  "add": [{"item":"missing material","recommendedQty":"supported quantity or TBC","planRequirement":"assembly/detail","reason":"why missing","source":"sheet/detail","confidence":"High"}],\n  "changeSpec": [{"item":"BOM item","bomSpec":"current spec","requiredSpec":"plan spec","reason":"why change","source":"sheet/detail","confidence":"High"}],\n  "verify": [{"item":"item/quantity","bomQty":"if shown","question":"what must be confirmed","source":"sheet/detail","confidence":"Medium"}],\n  "correctedBOM": [{"category":"Foundation / Walls / Roof / Openings / Bracing / Other","material":"material description","quantity":"working quantity","unit":"pcs/LF/sheets/etc","action":"KEEP/ADD/CHANGE","source":"sheet/detail","confidence":"High"}],\n  "warnings": ["important quote note"]\n}\n\nThe correctedBOM is a WORKING material list only: include items you can support from the evidence; do not pretend uncertain quantities are final. Before responding, cross-check the BOM against plan, elevation, section/detail and schedule information wherever available.`;
}
function downloadBomComparePrompt(){
 const blob=new Blob([buildBomComparePrompt()],{type:'text/plain'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`Forge-Scope-${current?.type||'standalone'}-BOM-Compare-Prompt.txt`; a.click(); URL.revokeObjectURL(a.href);

async function runBomCompare(){
 const err=document.getElementById('bomCompareError'); const status=document.getElementById('bomCompareStatus');
 bomCompareState.error=''; bomCompareState.status=''; if(err)err.textContent=''; if(status)status.textContent='';
 try{
  if(!bomCompareState.scope) throw new Error('Upload the Scope of Work first.');
  if(!bomCompareState.bom) throw new Error('Upload the bill of materials first.');
  if(!bomCompareState.plans.length) throw new Error('Upload at least one plan/drawing file.');
  if(!geminiSessionKey.trim()) throw new Error('Paste a Gemini API key, or use the Universal Compare Prompt below.');
  const files=[bomCompareState.scope,bomCompareState.bom,...bomCompareState.plans];
  const total=files.reduce((n,f)=>n+f.size,0); const max=45*1024*1024;
  if(total>max) throw new Error(`The selected files total ${(total/1024/1024).toFixed(1)} MB. For browser-based free AI, keep the combined upload under 45 MB or split/compress the plan set.`);
  bomCompareState.loading=true; if(status)status.textContent='Reading BOM and drawings...';
  const parts=[{text:buildBomComparePrompt()},{text:`\nSCOPE OF WORK FILE: ${bomCompareState.scope.name}`}];
  parts.push(await fileToGeminiPart(bomCompareState.scope));
  parts.push({text:`\nBILL OF MATERIALS FILE: ${bomCompareState.bom.name}`});
  parts.push(await fileToGeminiPart(bomCompareState.bom));
  for(let i=0;i<bomCompareState.plans.length;i++){
   const f=bomCompareState.plans[i]; if(status)status.textContent=`Preparing plan ${i+1} of ${bomCompareState.plans.length}: ${f.name}`;
   parts.push({text:`\nPLAN / DRAWING FILE ${i+1}: ${f.name}`}); parts.push(await fileToGeminiPart(f));
  }
  if(status)status.textContent='AI is cross-checking Scope of Work, BOM quantities and plans...';
  const response=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(geminiCompareModel)}:generateContent`,{
   method:'POST', headers:{'Content-Type':'application/json','x-goog-api-key':geminiSessionKey.trim()},
   body:JSON.stringify({contents:[{role:'user',parts}],generationConfig:{temperature:0.1,responseMimeType:'application/json'}})
  });
  const payload=await response.json().catch(()=>({}));
  if(!response.ok) throw new Error(payload?.error?.message||`Gemini request failed (${response.status}).`);
  const raw=(payload.candidates||[]).flatMap(c=>c.content?.parts||[]).map(p=>p.text||'').join('\n').trim();
  if(!raw) throw new Error('Gemini returned no comparison text.');
  const result=parseAIJson(raw);
  if(!result || typeof result!=='object') throw new Error('The AI response was not a comparison JSON object.');
  bomCompareState.result=result; bomCompareState.status='Comparison complete.'; bomCompareState.loading=false;
  if(current){ current.bomComparison={result,analyzedAt:new Date().toISOString(),scopeName:bomCompareState.scope.name,bomName:bomCompareState.bom.name,planNames:bomCompareState.plans.map(f=>f.name),model:geminiCompareModel}; upsertCurrent(); } render();
 }catch(e){bomCompareState.loading=false; bomCompareState.error=e.message||String(e); const el=document.getElementById('bomCompareError'); if(el)el.textContent=bomCompareState.error;}
}

 })).filter(sec=>sec.items.length);
 return `<div class="max-w-5xl mx-auto fade-in"><div class="no-print flex flex-wrap justify-between gap-3 mb-5"><button onclick="view='editor';render()" class="px-4 py-2.5 bg-white border border-slate-200 rounded-lg text-sm font-semibold flex items-center gap-2">${icon('arrow-left','w-4 h-4')} Back to Worksheet</button><div class="flex flex-wrap gap-2"><button onclick="copySummary()" class="px-4 py-2.5 bg-white border border-slate-200 rounded-lg text-sm font-semibold flex items-center gap-2">${icon('copy','w-4 h-4')} Copy</button><button onclick="exportJSON()" class="px-4 py-2.5 bg-white border border-slate-200 rounded-lg text-sm font-semibold flex items-center gap-2">${icon('braces','w-4 h-4')} JSON</button><button onclick="exportPDF()" class="px-4 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg text-sm font-semibold flex items-center gap-2">${icon('file-down','w-4 h-4')} Export PDF</button><button onclick="window.print()" class="px-4 py-2.5 bg-indigo-600 text-white rounded-lg text-sm font-semibold flex items-center gap-2">${icon('printer','w-4 h-4')} Print / PDF</button></div></div>
 <article class="scope-summary print-card bg-white border border-slate-200 rounded-2xl shadow-sm overflow-hidden"><div class="bg-slate-900 text-white px-7 py-6"><div class="flex justify-between gap-6 items-start"><div><div class="text-[10px] uppercase tracking-[.25em] text-indigo-300 font-bold">Forge Scope</div><h1 class="summary-title font-extrabold mt-1.5">${esc(project)}</h1>${customer?`<div class="text-slate-300 mt-1.5 text-[.805rem]">${esc(customer)}</div>`:''}</div><div class="text-right text-[.69rem] text-slate-400"><div>${TYPES[current.type].label} Scope Summary</div><div class="mt-1">Updated ${fmtDate(current.updatedAt)}</div></div></div></div>
 <div class="px-7 py-6 space-y-5">${exclusions?summaryExclusions(exclusions):''}${sections.map(summaryTable).join('')}${d.openings.length?summaryOpeningsTable(d.openings):''}</div>
 <div class="px-7 py-4 bg-slate-50 border-t border-slate-200 text-[.69rem] text-slate-500 flex justify-between"><span>Blank fields omitted automatically.</span><span>Forge Scope • Estimator Intake</span></div></article></div>`;
}
function summaryExclusions(x){
 return `<section class="rounded-xl border border-amber-200 bg-amber-50 px-4 py-3"><div class="summary-section-title font-extrabold uppercase tracking-wider text-amber-800">Scope Exclusions</div><div class="mt-1.5 font-semibold text-slate-800 whitespace-pre-wrap">${esc(x.value)}</div>${x.source?`<div class="summary-source mt-1">Source: ${esc(x.source)}</div>`:''}</section>`;
}
function summaryTable(sec){
 return `<section><h2 class="summary-section-title font-extrabold uppercase tracking-wider text-slate-500 mb-2">${sec.title}</h2><div class="border border-slate-200 rounded-xl overflow-hidden"><table class="summary-table w-full table-fixed"><thead class="bg-slate-50 text-slate-400 uppercase tracking-wider"><tr><th class="w-[27%] px-3 py-2 text-left font-bold">Field</th><th class="w-[53%] px-3 py-2 text-left font-bold">Value</th><th class="w-[20%] px-3 py-2 text-left font-bold">Source</th></tr></thead><tbody class="divide-y divide-slate-100">${sec.items.map(summaryTableRow).join('')}</tbody></table></div></section>`;
}
function summaryTableRow(x){
 const badge=x.status && x.status!=='Confirmed' ? `<span class="ml-1.5 text-[9px] px-1.5 py-0.5 rounded-full font-bold ${x.status==='RFI'?'bg-rose-100 text-rose-700':x.status==='Verify'?'bg-amber-100 text-amber-700':x.status==='Assumption'?'bg-violet-100 text-violet-700':'bg-slate-100 text-slate-600'}">${x.status}</span>`:'';
 return `<tr class="align-top"><td class="px-3 py-2 font-semibold text-slate-500">${x.label}${badge}</td><td class="px-3 py-2 font-semibold text-slate-800 whitespace-pre-wrap break-words">${esc(x.value)}</td><td class="summary-source px-3 py-2 break-words">${x.source?esc(x.source):'—'}</td></tr>`;
}
function summaryOpeningsTable(openings){
 return `<section><h2 class="summary-section-title font-extrabold uppercase tracking-wider text-slate-500 mb-2">Openings</h2><div class="border border-slate-200 rounded-xl overflow-hidden"><table class="summary-table w-full table-fixed"><thead class="bg-slate-50 text-slate-400 uppercase tracking-wider"><tr><th class="w-[25%] px-3 py-2 text-left font-bold">Opening</th><th class="w-[18%] px-3 py-2 text-left font-bold">Size</th><th class="w-[37%] px-3 py-2 text-left font-bold">Framing / Notes</th><th class="w-[20%] px-3 py-2 text-left font-bold">Source</th></tr></thead><tbody class="divide-y divide-slate-100">${openings.map((o,i)=>{const name=`${o.wall||'Opening '+(i+1)}${o.type?' — '+o.type:''}`;const size=[o.width,o.height].filter(Boolean).join(' x ')||'—';const notes=[o.location,o.header,o.framing,o.foundationDrop].filter(Boolean).join(' • ')||'—';return `<tr class="align-top"><td class="px-3 py-2 font-semibold text-slate-700">${esc(name)}</td><td class="px-3 py-2 text-slate-700">${esc(size)}</td><td class="px-3 py-2 text-slate-700 break-words">${esc(notes)}</td><td class="summary-source px-3 py-2 break-words">${o.source?esc(o.source):'—'}</td></tr>`;}).join('')}</tbody></table></div></section>`;
}
function summaryItem(x){ return summaryTableRow(x); }

function updateField(key,prop,val){ current.fields[key]=current.fields[key]||emptyField(); current.fields[key][prop]=val; current.updatedAt=new Date().toISOString(); }
function addOpening(){ current.openings.push({wall:'',type:'',width:'',height:'',location:'',header:'',framing:'',foundationDrop:'',source:'',reviewed:false,status:'Confirmed'}); render(); }
function removeOpening(i){ current.openings.splice(i,1); render(); }
function updateOpening(i,key,val){ current.openings[i][key]=val; current.updatedAt=new Date().toISOString(); }
let saveNoticeTimer=null;
function notifySaved(message='Saved in this browser'){
 let el=document.getElementById('forgeSaveNotice');
 if(!el){ el=document.createElement('div'); el.id='forgeSaveNotice'; el.className='fixed right-5 bottom-5 z-[100] rounded-xl bg-slate-900 text-white px-4 py-3 shadow-xl text-sm font-semibold transition-opacity'; document.body.appendChild(el); }
 el.textContent=message; el.style.opacity='1'; clearTimeout(saveNoticeTimer); saveNoticeTimer=setTimeout(()=>{el.style.opacity='0';},1800);
}
function saveCurrent(){ upsertCurrent(); render(); notifySaved(); }
function startNew(type,mode){ current=newProject(type,mode); view=mode==='ai'?'ai':'editor'; render(); }
function openProject(id){ current=JSON.parse(JSON.stringify(saved.find(p=>p.id===id))); view='editor'; render(); }
function duplicateProject(id){ const src=saved.find(p=>p.id===id); if(!src)return; const copy=JSON.parse(JSON.stringify(src)); copy.id='scope_'+Date.now(); copy.createdAt=copy.updatedAt=new Date().toISOString(); if(copy.fields.projectName?.value) copy.fields.projectName.value += ' — Copy'; saved.unshift(copy); persist(); render(); }
function deleteProject(id){ if(!confirm('Delete this saved scope?')) return; saved=saved.filter(p=>p.id!==id); persist(); render(); }
function go(v){ if(v==='ai' && !current){ view='new'; } else view=v; render(); }

function getSchemaKeys(type){ return SCHEMAS[type].flatMap(s=>s.fields.map(f=>({key:f.key,label:f.label,section:s.title}))); }
function buildAIPrompt(){
 const keys=getSchemaKeys(current.type);
 return `FORGE SCOPE — ${TYPES[current.type].label.toUpperCase()} PLAN EXTRACTION\n\nYou are assisting a construction estimator. Review ALL uploaded drawings and specifications thoroughly before answering. Search plans, foundation plans, floor plans, roof/truss plans, elevations, sections, schedules, general notes, structural notes, details and revisions.\n\nRULES:\n1. Do not guess. If information is not shown, omit the field.\n2. If drawings conflict, use status \"Verify\" and briefly explain the conflict in the value.\n3. Use the exact drawing terminology and dimensions where possible.\n4. Include a concise source for each populated value: sheet number + view/detail when available (example: \"S2.1 Roof Framing Plan\").\n5. Use status \"Confirmed\" for information clearly shown, \"Assumption\" only if I explicitly asked you to assume it, \"RFI\" if the missing item blocks the quote, and \"Verify\" for a conflict or uncertain interpretation.\n6. Return JSON only. No markdown fences, no explanation before or after JSON. If your interface supports creating files, also provide the exact result as a downloadable file named forge-scope.json.\n7. Omit unknown/blank fields completely.\n8. For openings, create one object per material opening that affects framing, trusses, foundations or supplied materials.\n\nPROJECT TYPE: ${current.type}\n\nRETURN THIS STRUCTURE:\n{\n  \"projectType\": \"${current.type}\",\n  \"fields\": {\n    \"fieldKey\": {\"value\": \"answer\", \"source\": \"drawing source\", \"status\": \"Confirmed\"}\n  },\n  \"openings\": [\n    {\"wall\":\"North Gable\",\"type\":\"Overhead Door\",\"width\":\"22'-0\\\"\",\"height\":\"14'-0\\\"\",\"location\":\"\",\"header\":\"\",\"framing\":\"\",\"foundationDrop\":\"\",\"source\":\"S2.0\",\"status\":\"Confirmed\"}\n  ]\n}\n\nALLOWED FIELD KEYS:\n${keys.map(x=>`- ${x.key} | ${x.section} | ${x.label}`).join('\n')}\n\nBefore producing JSON, internally cross-check the overall dimensions, wall heights, roof geometry, foundation support and major openings against at least two relevant drawing views when available. Do not output that internal reasoning.`;
}
function downloadAIPrompt(){ if(!current){ alert('Start a scope first.'); return; } const blob=new Blob([buildAIPrompt()],{type:'text/plain'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`Forge-Scope-${current.type}-AI-Prompt.txt`; a.click(); URL.revokeObjectURL(a.href); }
function parseAIJson(input){
 let raw=String(input||'').replace(/^\uFEFF/,'').trim();
 if(!raw) throw new Error('Choose a JSON file or paste the AI result first.');
 const attempts=[];
 const add=s=>{s=String(s||'').trim(); if(s && !attempts.includes(s)) attempts.push(s);};
 add(raw);
 const fenced=raw.match(/```(?:json)?\s*([\s\S]*?)```/i);
 if(fenced) add(fenced[1]);
 add(raw.replace(/^```(?:json)?\s*/i,'').replace(/```\s*$/,'').trim());
 const first=raw.indexOf('{'), last=raw.lastIndexOf('}');
 if(first!==-1 && last>first) add(raw.slice(first,last+1));
 let lastErr=null;
 for(const candidate of attempts){
  try{return JSON.parse(candidate);}catch(e){lastErr=e;}
 }
 throw new Error((lastErr?.message||'Invalid JSON')+' — The importer accepts a .json/.txt file, plain JSON, JSON inside ``` fences, or JSON surrounded by normal AI commentary.');
}
function applyAIData(data){
 if(!data || typeof data!=='object' || Array.isArray(data)) throw new Error('The imported file must contain one Forge Scope JSON object.');
 if(data.projectType && data.projectType!==current.type) throw new Error(`This JSON is for ${data.projectType}, but this scope is ${current.type}.`);
 const incoming=data.fields||{};
 if(!incoming || typeof incoming!=='object' || Array.isArray(incoming)) throw new Error('I found JSON, but it does not contain a valid "fields" object.');
 let imported=0;
 Object.entries(incoming).forEach(([k,v])=>{
  if(!(k in current.fields)) return;
  if(typeof v==='string') current.fields[k]={...current.fields[k],value:v,reviewed:false,status:'Confirmed'};
  else if(v && typeof v==='object') current.fields[k]={...current.fields[k],value:v.value??'',source:v.source??'',status:STATUS_OPTIONS.includes(v.status)?v.status:'Confirmed',reviewed:false};
  imported++;
 });
 if(Array.isArray(data.openings)) current.openings=data.openings.map(o=>({...o,reviewed:false,status:STATUS_OPTIONS.includes(o.status)?o.status:'Confirmed'}));
 if(imported===0 && !current.openings.length) throw new Error('The JSON was valid, but none of its field keys matched this Forge Scope template.');
 current.mode='ai'; upsertCurrent(); view='editor'; render();
}
function importAI(){
 const box=document.getElementById('aiJson'); const err=document.getElementById('aiError'); const ready=document.getElementById('aiReady');
 if(err) err.textContent=''; if(ready) ready.textContent='';
 try{ applyAIData(parseAIJson(box?.value||'')); }
 catch(e){ if(err) err.textContent='Could not import: '+e.message; }
}
function loadAIFile(input){
 const file=input?.files?.[0]; const err=document.getElementById('aiError'); const ready=document.getElementById('aiReady'); const name=document.getElementById('aiFileName');
 if(err) err.textContent=''; if(ready) ready.textContent='';
 if(!file) return;
 if(name) name.textContent=file.name;
 const reader=new FileReader();
 reader.onload=()=>{
  const box=document.getElementById('aiJson'); if(box) box.value=String(reader.result||'');
  try{ parseAIJson(reader.result); if(ready) ready.textContent=`${file.name} loaded and looks like valid JSON. Click Import Into Worksheet.`; }
  catch(e){ if(err) err.textContent='File loaded, but '+e.message; }
 };
 reader.onerror=()=>{ if(err) err.textContent='Could not read that file. Try downloading it again or paste the JSON instead.'; };
 reader.readAsText(file);
}

function exportJSON(){ const blob=new Blob([JSON.stringify(current,null,2)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=(current.fields.projectName?.value||'Forge-Scope').replace(/[^a-z0-9-_]+/gi,'-')+'.json'; a.click(); URL.revokeObjectURL(a.href); }
async function exportPDF(){
 const source=document.querySelector('.scope-summary');
 if(!source){ alert('Generate the scope summary first.'); return; }
 if(typeof html2pdf==='undefined'){ alert('PDF export could not load. Use Print / PDF as a fallback.'); return; }
 const project=(current?.fields?.projectName?.value||'Forge-Scope').replace(/[^a-z0-9-_]+/gi,'-').replace(/^-+|-+$/g,'')||'Forge-Scope';
 const clone=source.cloneNode(true);
 clone.style.width='7.6in'; clone.style.maxWidth='7.6in'; clone.style.margin='0'; clone.style.boxShadow='none'; clone.style.overflow='visible';
 clone.querySelectorAll('.no-print').forEach(el=>el.remove());
 const holder=document.createElement('div');
 holder.setAttribute('aria-hidden','true'); holder.style.position='fixed'; holder.style.left='-100000px'; holder.style.top='0'; holder.style.width='7.6in'; holder.style.background='white'; holder.appendChild(clone); document.body.appendChild(holder);
 const options={
   margin:[0.35,0.35,0.4,0.35],
   filename:`${project}-Scope.pdf`,
   image:{type:'jpeg',quality:0.98},
   html2canvas:{scale:1.5,useCORS:true,backgroundColor:'#ffffff',scrollY:0,windowWidth:900},
   jsPDF:{unit:'in',format:'letter',orientation:'portrait'},
   pagebreak:{mode:['css','legacy'],avoid:['tr']}
 };
 try{
   await html2pdf().set(options).from(clone).save();
 }catch(e){
   console.error('Forge Scope PDF export failed',e);
   alert('PDF export failed. Use Print / PDF as a fallback.');
 }finally{
   holder.remove();
 }
}
function textSummary(){ const d=summaryData(); let out=`FORGE SCOPE — ${TYPES[current.type].label.toUpperCase()}\n${current.fields.projectName?.value||'Untitled Scope'}\n\n`; d.sections.forEach(sec=>{out+=sec.title.toUpperCase()+'\n'; sec.items.forEach(x=>{out+=`• ${x.label}: ${x.value}${x.status&&x.status!=='Confirmed'?' ['+x.status+']':''}${x.source?' — Source: '+x.source:''}\n`;}); out+='\n';}); if(d.openings.length){out+='OPENINGS\n';d.openings.forEach((o,i)=>{out+=`• ${o.wall||'Opening '+(i+1)}${o.type?' — '+o.type:''}${o.width?' — '+o.width:''}${o.height?' x '+o.height:''}${o.header?' — '+o.header:''}${o.source?' — Source: '+o.source:''}\n`;});} return out; }
async function copySummary(){ try{await navigator.clipboard.writeText(textSummary()); alert('Scope summary copied.');}catch{alert('Copy failed.');} }

render();
</script>
