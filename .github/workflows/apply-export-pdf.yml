name: Apply Forge Scope PDF Export

on:
  push:
    paths:
      - '.github/workflows/apply-export-pdf.yml'
      - 'scripts/patch_export_pdf.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Patch Forge Scope export, print and save flow
        run: python scripts/patch_export_pdf.py

      - name: Commit patch if needed
        run: |
          if git diff --quiet; then
            echo "No patch needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add full PDF export and fix multipage printing"
          git push
