name: Fix Scope Core Persistence Source

on:
  push:
    paths:
      - '.github/workflows/fix-scope-core-persistence-source.yml'
      - 'scripts/fix_scope_core_persistence_source.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix Scope Core persistence source labels
        run: python scripts/fix_scope_core_persistence_source.py
      - name: Commit fix if needed
        run: |
          if git diff --quiet; then
            echo "No fix needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add forgeCoreScope.js
          git commit -m "Fix Forge Scope Core source labels"
          git push
