name: Apply Forge Suite Bridge

on:
  push:
    paths:
      - '.github/workflows/apply-forge-suite-bridge.yml'
      - 'scripts/patch_forge_suite_bridge.py'
      - 'forgeSuiteBridge.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Inject Forge Suite bridge
        run: python scripts/patch_forge_suite_bridge.py

      - name: Commit patch if needed
        run: |
          if git diff --quiet; then
            echo "No patch needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Connect Forge Scope to Forge CRM"
          git push
