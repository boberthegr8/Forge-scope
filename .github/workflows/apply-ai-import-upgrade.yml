name: Apply AI Import Upgrade

on:
  push:
    paths:
      - '.github/workflows/apply-ai-import-upgrade.yml'
      - 'scripts/patch_ai_import.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Patch Forge Scope AI import
        run: python scripts/patch_ai_import.py

      - name: Commit patch if needed
        run: |
          if git diff --quiet; then
            echo "No patch needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Improve AI JSON import and add file upload"
          git push
