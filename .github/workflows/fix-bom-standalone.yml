name: Fix Compare to BOM standalone navigation

on:
  push:
    branches: [main]
    paths:
      - tools/fix_bom_standalone.py
      - .github/workflows/fix-bom-standalone.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch Compare to BOM standalone flow
        run: python tools/fix_bom_standalone.py

      - name: Commit patch if needed
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Make Compare to BOM standalone"
          git push
